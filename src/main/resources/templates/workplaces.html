
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>職場管理</title>
    <style>
        nav {
            margin-bottom: 20px;
            padding: 10px;
            border: 1px solid black;
        }

        nav a {
            margin-right: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <nav>
        <a href="/workplaces">勤務先</a>
        |
        <a href="/shifts">シフト</a>
        |
        <a href="/salary">給料計算</a>
    </nav>

    <h1>職場管理</h1>

    <h2>職場を登録</h2>

    <form method="post" action="/workplaces">
        <p>
            <label>職場名：</label>
            <input type="text" name="name" required>
        </p>

        <p>
            <label>給与方式：</label>
            <select name="payType" id="payType" required>
                <option value="HOURLY">時給制</option>
                <option value="PER_LESSON">コマ制</option>
            </select>
        </p>

        <div id="hourlyFields">
            <p>
                <label>通常時給：</label>
                <input type="number" name="regularWage" min="1" value="1200">
            </p>

            <p>
                <label>割増時給：</label>
                <input type="number" name="premiumWage" min="1" value="1250">
            </p>
        </div>

        <div id="lessonFields" hidden>
            <p>
                <label>1コマあたりの料金（円）：</label>
                <input type="number" name="lessonWage" min="1" value="0" disabled>
            </p>
        </div>

        <button type="submit">登録</button>
    </form>

    <h2>登録された職場</h2>

    <ul>
        <li th:each="workplace : ${workplaces}">
            <span th:text="${workplace.name}"></span>

            <span th:if="${workplace.payType == null or workplace.payType == 'HOURLY'}">
                （時給制・通常：
                <span th:text="${workplace.regularWage}"></span>円、
                割増：
                <span th:text="${workplace.premiumWage}"></span>円）
            </span>

            <span th:if="${workplace.payType == 'PER_LESSON'}">
                （コマ制・1コマ：
                <span th:text="${workplace.lessonWage}"></span>円）
            </span>

            <form th:action="@{/workplaces/delete/{id}(id=${workplace.id})}"
                  method="post">
                <button type="submit">削除</button>
            </form>

            <a th:href="@{/workplaces/edit/{id}(id=${workplace.id})}">編集</a>
        </li>
    </ul>

    <script>
        const payType = document.getElementById("payType");
        const hourlyFields = document.getElementById("hourlyFields");
        const lessonFields = document.getElementById("lessonFields");

        const regularWage = document.querySelector(
            'input[name="regularWage"]'
        );
        const premiumWage = document.querySelector(
            'input[name="premiumWage"]'
        );
        const lessonWage = document.querySelector(
            'input[name="lessonWage"]'
        );

        function updatePayFields() {
            const isHourly = payType.value === "HOURLY";

            hourlyFields.hidden = !isHourly;
            lessonFields.hidden = isHourly;

            regularWage.disabled = !isHourly;
            premiumWage.disabled = !isHourly;
            regularWage.required = isHourly;
            premiumWage.required = isHourly;

            lessonWage.disabled = isHourly;
            lessonWage.required = !isHourly;
        }

        payType.addEventListener("change", updatePayFields);
        updatePayFields();
    </script>
</body>
</html>
